services:
  mock_api:
    build: ./mock_api
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/jobs/events', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  runner:
    build: .
    depends_on:
      mock_api:
        condition: service_healthy
    environment:
      MOCK_API_URL: http://mock_api:5000
      PIPELINE_CONFIG: config.json
      PYTHONUNBUFFERED: "1"